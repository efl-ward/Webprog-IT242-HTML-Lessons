<!DOCTYPE html>
<html lang="en">
<head>
    <title>Portfolio | Eduard Serna</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/design.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

<div id="app">
    <nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">{{ profile.shortName }}</a>
            <div class="ms-auto">
                <a href="resources.html" class="nav-link btn btn-outline-info btn-sm px-3">Documentation</a>
            </div>
        </div>
    </nav>

    <header class="container-fluid py-5 text-center text-white">
        <div class="glass-panel p-5 animate-fade-in">
            <h1 class="display-3 fw-bold">{{ profile.name }}</h1>
            <p class="lead typewriter">{{ greetingMessage }}<span class="cursor">_</span></p>
        </div>
    </header>

    <main class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <section class="glass-card h-100 fade-in-left">
                    <h3 class="section-title"><i class="fa-solid fa-id-card"></i> About</h3>
                    <p>{{ profile.bio }}</p>
                    <ul class="custom-list">
                        <li v-for="(val, key) in profile.details">
                            <strong>{{ key }}:</strong> {{ val }}
                        </li>
                    </ul>
                </section>
            </div>

            <div class="col-lg-8">
                <section class="glass-card h-100 fade-in-right">
                    <h3 class="section-title"><i class="fa-solid fa-microchip"></i> Expertise</h3>
                    <div class="mb-4">
                        <span v-for="skill in skills" class="badge glow-badge">{{ skill }}</span>
                    </div>
                    <table class="table table-borderless text-white">
                        <thead><tr><th>Level</th><th>Institution</th></tr></thead>
                        <tbody>
                            <tr v-for="edu in education">
                                <td>{{ edu.level }}</td>
                                <td>{{ edu.name }}</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>

        <section class="mt-5 fade-in-up">
            <h3 class="section-title text-center"><i class="fa-solid fa-images"></i> Visual Portfolio</h3>
            <picture-gallery></picture-gallery>
        </section>

        <section class="mt-5 mb-5 fade-in-up">
            <h3 class="section-title text-center"><i class="fa-solid fa-comments"></i> Guestbook</h3>
            <guestbook-form></guestbook-form>
        </section>
    </main>

    <footer class="footer-glass py-4 text-center text-white-50">
        <p>&copy; 2026 {{ profile.name }} | Built with Vue.js & Bootstrap 5</p>
    </footer>
</div>

<script src="js/design.js"></script>
</body>
</html>
