<div id="profileCarousel" class="carousel slide mb-3" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#profileCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#profileCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#profileCarousel" data-bs-slide-to="2"></button>
  </div>
  
  <div class="carousel-inner rounded shadow-sm">
    <div class="carousel-item active">
      <img src="https://luxlux.net/lux/wp-content/uploads/steph-curry-4-1-scaled.jpeg" class="d-block w-100" alt="Slide 1">
    </div>
    <div class="carousel-item">
      <img src="https://via.placeholder.com/500x600?text=Basketball+Action" class="d-block w-100" alt="Slide 2">
    </div>
    <div class="carousel-item">
      <img src="https://via.placeholder.com/500x600?text=Travel+Photo" class="d-block w-100" alt="Slide 3">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#profileCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#profileCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
